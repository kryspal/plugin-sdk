// Kryspal Media Plugin protocol v1: danmaku providers.
//
// Capabilities and the methods they map to:
//   danmaku.provider  GetDanmaku
//   danmaku.match     SearchDanmakuCandidates (with danmaku.provider)
// For capabilities the plugin does not declare, the corresponding calls return UNIMPLEMENTED. No results means an empty
// list, not NOT_FOUND.
syntax = "proto3";

package kryspal.plugin.v1;

import "pluginv1/metadata.proto";

option go_package = "github.com/kryspal/plugin-sdk/pluginv1;pluginv1";

// DanmakuProvider is implemented by plugins that declare danmaku.provider.
service DanmakuProvider {
  // GetDanmaku fetches the danmaku of a movie or an episode. The host is responsible for caching.
  rpc GetDanmaku(GetDanmakuRequest) returns (GetDanmakuResponse);
  // SearchDanmakuCandidates lists what an administrator can pick as this plugin's match for an item (danmaku.match).
  // The key of the chosen candidate comes back in GetDanmakuRequest.match_override.
  rpc SearchDanmakuCandidates(SearchDanmakuCandidatesRequest) returns (SearchDanmakuCandidatesResponse);
}

message GetDanmakuRequest {
  // ITEM_TYPE_MOVIE or ITEM_TYPE_EPISODE.
  ItemType type = 1;
  // Movie: the movie's provider IDs; episode: the series' provider IDs.
  map<string, string> provider_ids = 2;
  optional int32 season_number = 3;
  optional int32 episode_number = 4;
  // Title and year, for matching against sources that have no ID mapping.
  string title = 5;
  int32 year = 6;
  // Runtime of the local file (milliseconds); 0 means unknown.
  int64 duration_ms = 7;
  Languages languages = 8;
  // The original title of the item (for an episode, of the series), when it has one that differs from title; empty
  // otherwise. Sent by hosts with the host feature lookup_names. A source that lists works under their original
  // names can try it when title finds nothing.
  string original_title = 9;
  // The item's product code (catalog number), for a movie or an episode; empty when it has none. Sent by hosts with
  // the host feature lookup_names.
  string product_code = 10;
  // The match an administrator picked for this item from SearchDanmakuCandidates, as the plugin's own key; empty
  // when there is none. When set, use it instead of searching. Sent by hosts with the host feature danmaku_override.
  string match_override = 11;
  // Absolute paths of the item's local media files (every version, main version first), for plugins that read
  // danmaku files next to the video. Files on cloud drives and remote sources are not listed. Sent by hosts with the
  // host feature danmaku_media_paths.
  repeated string media_paths = 12;
}

message SearchDanmakuCandidatesRequest {
  // What the administrator typed; may be a title or, if the plugin supports it, the address of a video page.
  string text = 1;
  // ITEM_TYPE_MOVIE or ITEM_TYPE_EPISODE: the kind of item the match is for.
  ItemType type = 2;
  optional int32 season_number = 3;
  optional int32 episode_number = 4;
  Languages languages = 5;
}

message DanmakuCandidate {
  // Opaque to the host; stored as is (at most 2048 bytes) and sent back as GetDanmakuRequest.match_override.
  string key = 1;
  string title = 2;
  // For example the episode title; may be empty.
  string subtitle = 3;
  // Number of episodes of the work; 0 when unknown.
  int32 episode_count = 4;
}

message SearchDanmakuCandidatesResponse {
  // Best first; the host shows at most 50.
  repeated DanmakuCandidate candidates = 1;
}

// DanmakuMode is how a danmaku comment is displayed.
enum DanmakuMode {
  DANMAKU_MODE_UNSPECIFIED = 0;  // treated as SCROLL
  DANMAKU_MODE_SCROLL = 1;
  DANMAKU_MODE_TOP = 2;
  DANMAKU_MODE_BOTTOM = 3;
}

message DanmakuComment {
  // When it appears (milliseconds, relative to 0 at the start of the video).
  int64 time_ms = 1;
  string text = 2;
  // 0xRRGGBB; 0 means the default white.
  uint32 color = 3;
  DanmakuMode mode = 4;
  // Name of the source site (e.g. when the plugin connects to several sites), for display and filtering.
  string source = 5;
}

message GetDanmakuResponse {
  // In increasing time order. The host uses at most the first 20000 comments.
  repeated DanmakuComment comments = 1;
}
