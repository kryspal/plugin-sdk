// Kryspal Media Plugin protocol v1: user sync, e.g. Trakt's watched history and now-playing reports.
//
// Capabilities and the methods they map to:
//   usersync.link                         BeginLink, PollLink, Unlink
//   usersync.scrobble                     Scrobble
//   usersync.watched.pull, watched.push   PullWatched, PushWatched
//
// Plugins are stateless: the host stores members' credentials encrypted and passes them in on every call; when they need
// updating (e.g. refresh token rotation), the plugin returns updated_credentials with the response,
// and the host **writes them before using them**, and guarantees the same credential is never used concurrently. Plugins
// must not store or log credentials, and never see member IDs.
// An invalid credential (revoked, or expired and not refreshable) returns UNAUTHENTICATED: the host only marks this
// member's link as needing to be re-linked; the plugin stays online.
syntax = "proto3";

package kryspal.plugin.v1;

import "pluginv1/metadata.proto";

option go_package = "github.com/kryspal/plugin-sdk/pluginv1;pluginv1";

// UserSync is implemented by plugins that declare usersync.* capabilities.
service UserSync {
  // BeginLink starts a link (OAuth device code flow) and returns the code and URL to show the member.
  rpc BeginLink(BeginLinkRequest) returns (LinkChallenge);
  // PollLink checks whether the member has authorized. The host polls it at the given interval; the plugin must not wait
  // internally.
  rpc PollLink(PollLinkRequest) returns (LinkResult);
  // Unlink revokes the authorization (best effort). If revoking upstream fails it still returns success, and the host
  // deletes the local credential anyway.
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);

  // Scrobble reports the now-playing state. The host guarantees each event_id is removed from its queue only after a
  // success, so it may be resent.
  rpc Scrobble(ScrobbleRequest) returns (ScrobbleResponse);

  // PullWatched fetches the upstream watched history, paginated.
  rpc PullWatched(PullWatchedRequest) returns (PullWatchedResponse);
  // PushWatched writes the local watched history upstream, at most 100 entries per batch.
  rpc PushWatched(PushWatchedRequest) returns (PushWatchedResponse);
}

// Credentials is opaque data defined by the plugin and not parsed by the host (access token, refresh token, expiry,
// etc.); the plugin versions its format itself.
message Credentials {
  bytes data = 1;
}

message BeginLinkRequest {
  Languages languages = 1;
}

message LinkChallenge {
  string user_code = 1;
  string verification_url = 2;
  int32 expires_in_seconds = 3;
  // Suggested polling interval.
  int32 interval_seconds = 4;
  // Opaque state defined by the plugin (e.g. device_code); the host passes it back unchanged in PollLink.
  bytes state = 5;
}

message PollLinkRequest {
  bytes state = 1;
}

message LinkResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_AUTHORIZED = 2;
    STATUS_DENIED = 3;
    STATUS_EXPIRED = 4;
  }
  Status status = 1;
  // Set when STATUS_AUTHORIZED.
  Credentials credentials = 2;
  // Account name for display, e.g. the username; empty when there is none.
  string account_label = 3;
  // Set only with STATUS_PENDING, when the upstream asks for slower polling.
  int32 retry_after_seconds = 4;
}

message UnlinkRequest {
  Credentials credentials = 1;
}

message UnlinkResponse {}

// MediaRef is the information a plugin needs to identify an item. The host fills in as much as it can, and the plugin
// picks the IDs it recognizes.
message MediaRef {
  // Only ITEM_TYPE_MOVIE or ITEM_TYPE_EPISODE.
  ItemType type = 1;
  string title = 2;
  int32 year = 3;
  // IDs of the item itself; for an episode, the episode's IDs go here first.
  map<string, string> provider_ids = 4;
  // IDs of the series the episode belongs to.
  map<string, string> series_ids = 5;
  optional int32 season_number = 6;
  optional int32 episode_number = 7;
}

message ScrobbleRequest {
  Credentials credentials = 1;
  // Unique ID generated by the host, for deduplication by the plugin and the upstream.
  string event_id = 2;
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_START = 1;
    ACTION_PAUSE = 2;
    // When enough has been played to count as watched, the upstream marks it watched.
    ACTION_STOP = 3;
  }
  Action action = 3;
  MediaRef media = 4;
  // 0 to 100.
  double progress_percent = 5;
  // When the event happened (UTC, RFC 3339); unchanged on resend.
  string occurred_at = 6;
}

message ScrobbleResponse {
  // Set only when the credential was updated; the host overwrites the stored one.
  Credentials updated_credentials = 1;
}

message PullWatchedRequest {
  Credentials credentials = 1;
  // Cursor returned by the previous page; the empty string means start from the beginning.
  string cursor = 2;
  // Only records changed after this time (UTC, RFC 3339); the empty string means all.
  string since = 3;
  // 0 lets the plugin decide.
  int32 limit = 4;
}

message WatchedEntry {
  MediaRef media = 1;
  // false means the upstream marked it unwatched.
  bool watched = 2;
  // UTC, RFC 3339; empty when unknown.
  string watched_at = 3;
  int32 play_count = 4;
}

message PullWatchedResponse {
  repeated WatchedEntry entries = 1;
  // The empty string means there is no next page.
  string next_cursor = 2;
  Credentials updated_credentials = 3;
}

message PushWatchedRequest {
  Credentials credentials = 1;
  // At most 100 entries per batch.
  repeated WatchedEntry entries = 2;
}

message PushWatchedResponse {
  // Entries for which the upstream found no matching item (given as indexes into entries). The host does not resend
  // them, only logs them.
  repeated int32 unmatched = 1;
  Credentials updated_credentials = 2;
}
