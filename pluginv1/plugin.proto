// Kryspal Media Plugin protocol v1: the plugin's own description and configuration.
//
// The specification of the handshake, error codes, health checks and the plugin catalog is in ../PROTOCOL.md.
// Once this file is published it only accepts compatible additions: field numbers and types do not change, and
// deleted numbers are never reused. Incompatible changes go into kryspal.plugin.v2.
syntax = "proto3";

package kryspal.plugin.v1;

option go_package = "github.com/kryspal/plugin-sdk/pluginv1;pluginv1";

// Plugin is the service that every plugin must implement.
service Plugin {
  // Describe returns the plugin's manifest. Labels, descriptions and other text are returned in language; when the
  // plugin does not have that language it returns English.
  // While a plugin is running, the response must stay the same apart from the language of the text.
  rpc Describe(DescribeRequest) returns (Manifest);

  // Configure validates and applies a complete configuration.
  //
  // When both error and field_errors in the response are empty, the configuration was accepted and is in effect.
  // When either is non-empty, the plugin must not apply this configuration and keeps using the previous one (or
  // stays unconfigured).
  // gRPC errors are only for problems other than the configuration itself, such as an internal plugin error.
  //
  // The host calls it after the plugin starts and whenever an administrator changes the configuration. After the
  // plugin starts and before it has received a valid configuration, metadata calls should return FAILED_PRECONDITION.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
}

message DescribeRequest {
  // BCP 47 language tag, for example zh-TW or en. An empty string means English.
  string language = 1;
}

// Manifest is the plugin's declaration.
message Manifest {
  // Plugin ID: lowercase letters, digits and hyphens, starting with a letter or digit, at most 63 characters, for
  // example tmdb. Must match the id in the plugin catalog.
  string id = 1;
  // Display name.
  string name = 2;
  // Short description, in DescribeRequest.language.
  string description = 3;
  // Plugin version, semver, for example 1.2.0. Must match the version in the plugin catalog.
  string version = 4;
  // Major protocol version the plugin implements, 1 for v1; must equal the major version declared in the handshake line.
  uint32 protocol_version = 5;
  // Capabilities the plugin provides, for example metadata.movie. The full list is in PROTOCOL.md. The host ignores
  // capabilities it does not recognize.
  repeated string capabilities = 6;
  // Configuration fields, in declaration order.
  repeated ConfigField config_fields = 7;
  // Groups of configuration fields, in declaration order.
  repeated ConfigGroup config_groups = 8;
  // Attribution for the data source, shown on the admin console's plugin page and About page.
  Attribution attribution = 9;
  // Suggested limit on concurrent calls; 0 means no suggestion and the host uses the default of 4. Administrators
  // can override it.
  uint32 suggested_concurrency = 10;
  // Host permissions the plugin needs, for example ["llm"] (uses AI enhancement). The host ignores
  // permissions it does not recognize; administrators allow each permission for each plugin individually, and
  // without that permission the plugin's calls to the Host service return PERMISSION_DENIED.
  repeated string permissions = 11;
  // No longer used; the host ignores it. Paid plans gate capabilities, not plugins (PROTOCOL.md §11.5).
  repeated string features = 12;
  // For plugins that declare the capability cast.target: the protocol they speak, "dlna" or "chromecast",
  // shown by the admin console. The host ignores values it does not recognize.
  string cast_protocol = 13;
  // How the host downloads this plugin's images from hosts that require a Referer. At most 32 rules. May depend on
  // the configuration: the host calls Describe again after each accepted Configure.
  repeated ImageFetchRule image_fetch_rules = 14;
  // Maintenance tasks the plugin offers (capability plugin.tasks), run by the host on a schedule or on demand.
  repeated TaskDeclaration tasks = 15;
  // Display names for the attribute keys the plugin sends (ItemMetadata.attributes, PersonMetadata.attributes), in
  // DescribeRequest.language. Optional: keys without a label are shown as they are, and suggested keys are translated
  // by the host whatever is declared here. A plugin may label only the languages it targets.
  repeated AttributeLabel attribute_labels = 16;
  // The plugin's author or publisher, plain text, at most 64 characters. Optional. Shown in the plugin center when
  // the plugin has no catalog entry (development mode, manual installs); a catalog entry's owner takes precedence.
  string author = 17;
  // The plugin's project page, for example its source repository: an absolute https URL of at most 512 characters.
  // Optional; same precedence as author (the catalog entry's homepage wins).
  string homepage = 18;
  // Checks an administrator can run from the plugin's settings page (capability plugin.checks), for example "test the
  // API key" or "show the remaining quota". In DescribeRequest.language. At most 16.
  repeated CheckDeclaration checks = 19;
  // Badge rules the plugin suggests for the tags it produces (Recognition.tags, ItemMetadata.tags). At most 16; the
  // host skips invalid entries and the rest after the 16th without failing the plugin. The host never enables them
  // by itself: it lists them on its badge settings and the administrator adds the ones they want. Hosts that do not
  // declare the host feature badge_suggestions ignore this field.
  repeated SuggestedBadgeRule suggested_badge_rules = 20;
}

// CheckDeclaration is one check shown as a button on the plugin's settings page.
message CheckDeclaration {
  // Unique within the plugin: a lowercase letter, then lowercase letters, digits and underscores, at most 48 characters.
  string id = 1;
  // Button text, in DescribeRequest.language.
  string label = 2;
  // What the check does, in DescribeRequest.language; may be empty.
  string description = 3;
  // ConfigGroup.key of the group the button belongs to; empty puts it at the top of the settings page.
  string group = 4;
  // The check is about one entry of the group's list (ConfigGroup.items), for example "Test this source": the admin
  // console shows the button inside each entry and RunCheckRequest.item names the entry. Needs a group with items;
  // otherwise the host shows the button once in the group and sends no item.
  bool per_item = 5;
}

// AttributeLabel is the display name of one attribute key.
message AttributeLabel {
  string key = 1;
  string label = 2;
}

// ImageFetchRule tells the host which Referer to send when it downloads an image from certain hosts.
message ImageFetchRule {
  // Host names the rule applies to, at most 16: an exact name (img.example.com) or a leading wildcard (*.example.com,
  // which matches subdomains only). IP addresses and a lone * are not allowed.
  repeated string hosts = 1;
  // The Referer sent with matching downloads: an absolute https or http URL.
  string referer = 2;
  // Key of one of this plugin's settings (a string or secret field) whose value is a proxy URL (http, https or socks5).
  // The host downloads images from matching hosts through that proxy. Empty: no plugin proxy; the host's
  // own image download proxy, if the administrator set one, still applies. The host never logs or echoes the value.
  string proxy_from = 3;
}

// TaskDeclaration is a task the plugin can run through TaskRunner.RunTask.
message TaskDeclaration {
  // Unique within the plugin: a lowercase letter, then lowercase letters, digits and underscores, at most 48
  // characters. Do not rename it after release.
  string name = 1;
  // Title, in DescribeRequest.language.
  string title = 2;
  // Description, in DescribeRequest.language; may be empty.
  string description = 3;
  // The default schedule; unset means the task runs only when an administrator starts it.
  TaskSchedule default_schedule = 4;
}

// TaskSchedule is a schedule: set exactly one of the fields.
message TaskSchedule {
  // Run every this many minutes, 5 to 44640.
  uint32 interval_minutes = 1;
  // A five-field cron expression (minute hour day month weekday) in the server's time zone, for example "0 4 * * *".
  string cron = 2;
}

// Attribution is the credit a data source requires, for example the text and logo required by the TMDB terms.
message Attribution {
  // Attribution text, in DescribeRequest.language.
  string text = 1;
  // HTTPS URL of the logo image.
  string logo_url = 2;
  // HTTPS URL of the data source's website.
  string link = 3;
}

// ConfigFieldType is the type of a configuration field. Values of every type are passed as strings; the encoding
// is described at ConfigField.default_value.
enum ConfigFieldType {
  CONFIG_FIELD_TYPE_UNSPECIFIED = 0;
  // Single-line text.
  CONFIG_FIELD_TYPE_STRING = 1;
  // Secret text, such as an API key. The host stores it encrypted; the admin interface only shows whether it is set
  // and never returns the value.
  CONFIG_FIELD_TYPE_SECRET = 2;
  // Boolean.
  CONFIG_FIELD_TYPE_BOOL = 3;
  // Integer; the range is given by min and max.
  CONFIG_FIELD_TYPE_INT = 4;
  // Single choice from options.
  CONFIG_FIELD_TYPE_SELECT = 5;
  // Multiple choice from options.
  CONFIG_FIELD_TYPE_MULTISELECT = 6;
  // Multi-line text, for example a mapping table with one entry per line. At most 64 KiB.
  CONFIG_FIELD_TYPE_TEXT = 7;
  // A list of strings the user adds, removes and reorders.
  CONFIG_FIELD_TYPE_STRING_LIST = 8;
  // Multiple choice from options in an order the user sets, for example data sources by priority.
  CONFIG_FIELD_TYPE_ORDERED_MULTISELECT = 9;
}

// ConfigField declares one configuration field. The admin console generates the form from these declarations.
message ConfigField {
  // Field key: lowercase letters, digits and underscores, starting with a letter, for example api_token. Unique
  // within a plugin; should not be renamed after publication.
  string key = 1;
  // Label, in DescribeRequest.language.
  string label = 2;
  // Description, in DescribeRequest.language; plain text.
  string description = 3;
  // HTTPS URL of an external link, for example the page where an API key is requested.
  string link = 4;
  // Text of the external link, in DescribeRequest.language; when empty the admin console shows the URL.
  string link_label = 5;
  ConfigFieldType type = 6;
  // Required. When a required field has no value, the plugin is in the needs-configuration state.
  bool required = 7;
  // Default value, encoded as a string:
  //   string, secret: as is; secret should have no default value.
  //   bool: true or false.
  //   int: a decimal integer.
  //   select: one value from options.
  //   multiselect: a JSON array of strings made of option values, for example ["en","ja"]; an empty array is [].
  //   text: as is, lines separated by \n.
  //   string_list: a JSON array of strings, for example ["a","b"]; an empty array is [].
  //   ordered_multiselect: a JSON array of the chosen option values, highest priority first; unchosen options are
  //   absent.
  // Configuration values (ConfigureRequest.values) use the same encoding.
  string default_value = 8;
  // Hint text shown when the field is empty, in DescribeRequest.language.
  string placeholder = 9;
  // ConfigGroup.key of the group the field belongs to; an empty string means it belongs to no group.
  string group = 10;
  // Options for select and multiselect, in display order.
  repeated ConfigOption options = 11;
  // Lower and upper bounds for int (inclusive); unset means no limit.
  optional int64 min = 12;
  optional int64 max = 13;
  // When set, the field is shown only while another field has one of the given values. A hidden field keeps its
  // value and is still sent in Configure, but a hidden required field does not make the plugin need configuration.
  ConfigCondition visible_when = 14;
  // ConfigItem.id of one item of the field's group (ConfigGroup.items): the field is one of that item's settings and
  // the admin console shows it when the item is opened. Empty means the field belongs to the group itself. The host
  // ignores an item that the group does not list (the field is shown in the group). Host feature config_items.
  string item = 15;
  // The field may be overridden per library (host feature library_config): the library settings page shows it with
  // "Use the plugin setting" as the default, and requests for that library carry the override in
  // LibraryContext.overrides. Not allowed on secret or required fields. At most 32 fields per plugin. A library's
  // language comes from the request's languages, so do not declare a per-library language field.
  bool library_override = 16;
}

// ConfigCondition makes a field depend on another field's current value.
message ConfigCondition {
  // Key of a bool, select, string, int, multiselect or ordered_multiselect field of the same plugin. Conditions on
  // other types, or on keys that do not exist, are ignored (the field is always shown).
  string key = 1;
  // For bool, select, string and int: the field is shown when the other field's value, in its string encoding (for
  // example "true"), is one of these. For multiselect and ordered_multiselect: the field is shown when any chosen
  // option is one of these.
  repeated string values = 2;
}

// ConfigOption is one option of a select or multiselect.
message ConfigOption {
  // Option value, i.e. the string stored in the configuration value.
  string value = 1;
  // Display text, in DescribeRequest.language.
  string label = 2;
}

// ConfigGroup is a group of configuration fields. The form first shows the fields that belong to no group, then each
// group in config_groups order; within a group, fields follow their declaration order.
message ConfigGroup {
  // Group key, unique within a plugin.
  string key = 1;
  // Group title, in DescribeRequest.language.
  string title = 2;
  // Group description, in DescribeRequest.language; may be empty.
  string description = 3;
  // Settings most users never change. The admin console lists advanced groups last and keeps them collapsed.
  bool advanced = 4;
  // Icon shown before the title, one of: general, source, person, image, translate, network, schedule, advanced. Other
  // values show no icon.
  string icon = 5;
  // Items make the group a list of similar things that each have the same settings, for example one entry per data
  // source. The admin console shows the list (searchable when it is long, with a mark on items whose settings differ
  // from the defaults) and the settings of one item at a time; fields of the group without an item are shown above the
  // list. At most 100 items, in display order. Host feature config_items.
  repeated ConfigItem items = 6;
}

// ConfigItem is one entry of a group's list (ConfigGroup.items). Its settings are the fields whose item is its id.
message ConfigItem {
  // Lowercase letter, then lowercase letters, digits or underscores, at most 48; unique within the group. It is only a
  // reference: field keys stay as declared, so a plugin usually derives them from it (for example src_<id>_proxy).
  string id = 1;
  // Display name, in DescribeRequest.language.
  string label = 2;
  // Optional short description, in DescribeRequest.language; plain text.
  string description = 3;
}

message ConfigureRequest {
  // The complete configuration values, keyed by ConfigField.key; the value encoding is described at
  // ConfigField.default_value. Fields without a value are absent from the map; the host does not fill in defaults
  // for the plugin. Secret fields are in plain text.
  map<string, string> values = 1;
  // Language of error messages, BCP 47; an empty string means English.
  string language = 2;
  // Set only with dry_run: the library whose overrides (library.overrides) are being saved. values holds the
  // plugin's global configuration as usual.
  LibraryContext library = 3;
  // Check the values (with library's overrides on top, when set) and report problems as for a normal Configure, but
  // do not apply anything and have no side effects. The host sends it when an administrator saves per-library
  // settings, only while the plugin is running (it never wakes an idle plugin for it). A plugin that does not support
  // it returns UNIMPLEMENTED and the host then checks only types, options and bounds. Host feature library_config.
  bool dry_run = 4;
}

// LibraryContext tells the plugin which library a request is for and which settings that library overrides (host
// feature library_config). Use the values only for this request: never store them in the plugin's state, because
// requests for different libraries run in parallel. Read them through the SDK's effective settings view, which puts
// the overrides on top of the last global Configure values.
message LibraryContext {
  // Opaque, stable library identifier; use it only as a cache key or for logging.
  string library_id = 1;
  // Only the keys this library overrides (fields with library_override), in the ConfigureRequest.values encoding.
  // A key that is present overrides the global value even when its value is empty; a key that is absent means "use
  // the plugin setting". Ignore unknown keys and values that no longer fit the field (for example a removed option)
  // and fall back to the global value; never fail the request because of them.
  map<string, string> overrides = 2;
}

message ConfigureResponse {
  // Overall error, in ConfigureRequest.language; an empty string means there is no overall error.
  string error = 1;
  // Errors for individual fields, keyed by ConfigField.key, for example api_token → "Invalid API key"; same language
  // as above.
  map<string, string> field_errors = 2;
}

// SuggestedBadgeRule suggests one poster badge: show text on items whose tags include tag.
message SuggestedBadgeRule {
  // The tag value to match, compared case-insensitively with the item's tags. Required; at most 32 characters, no
  // control characters, no leading or trailing spaces.
  string tag = 1;
  // The badge text. Required; at most 8 characters, no control characters, no leading or trailing spaces. CJK text is
  // allowed, but the host draws badges into images with its own font and may refuse characters the font cannot draw.
  string text = 2;
  // Background color as #RRGGBB; empty uses the host's default.
  string color = 3;
}
